<div class="form-toggle-field{% if wide %} form-field-wide{% endif %}">
    <label class="form-toggle" for="{{ field.id_for_label }}">
        {{ field }}
        <span class="form-toggle-control" aria-hidden="true"></span>
        <span class="form-toggle-copy">
            <strong>{{ label }}</strong>
            {% if label_sw %}<span class="field-translation">{{ label_sw }}</span>{% endif %}
            {% if description %}<small>{{ description }}</small>{% endif %}
        </span>
    </label>
    {{ field.errors }}
</div>
