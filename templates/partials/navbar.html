<div class="topbar">
    <div class="topbar-title">
        <h2>Bahasha Admin Dashboard</h2>
        <p>Church Contribution Management System</p>
    </div>

    <div class="topbar-actions">
        <div class="user-info">
            <div>Welcome,</div>
            <strong>{{ request.user.full_name }}</strong>
            <div class="user-role">
                {{ request.user.get_role_display }}
            </div>
        </div>
        <a href="{% url 'web_profile' %}" class="btn-secondary">
            Profile
        </a>
        <form method="post" action="{% url 'logout' %}" class="inline-form">
            {% csrf_token %}
            <button type="submit" class="btn-secondary">Logout</button>
        </form>
    </div>
</div>
