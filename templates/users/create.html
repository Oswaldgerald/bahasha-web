{% extends "base.html" %}

{% block content %}

<h1>Add User</h1>

<div class="card">

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn-primary">
            Save User
        </button>

        <a href="{% url 'web_users' %}" class="btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
